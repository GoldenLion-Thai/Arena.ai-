# Production edge for the private workspace.
#
# The two things that break token streaming in nginx are buffering and short
# read timeouts. Both are handled below; if you change nothing else, keep
# `proxy_buffering off` and the 600s read timeout.

upstream grid_app {
    server 127.0.0.1:8080;      # node server.js (static UI + /gateway proxy)
    keepalive 32;
}

# Or terminate the gateway at nginx and skip the node proxy entirely.
upstream ollama_backend {
    server 127.0.0.1:11434;     # loopback only — never a public address
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name llm.yourdomain.co.uk;

    ssl_certificate     /etc/ssl/private/llm.crt;
    ssl_certificate_key /etc/ssl/private/llm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # Authentication belongs HERE, not in the static bundle: an auth_request to
    # your IdP, or an OIDC-aware proxy in front. The reference build ships no
    # authentication of its own and must not be exposed without one.
    # auth_request /auth;

    client_max_body_size 200m;   # document uploads

    root /opt/grid-os-sovereign;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Model gateway — token streaming must never be buffered.
    location /gateway/ {
        proxy_pass http://ollama_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;   # long generations, slow reasoning models
        add_header X-Accel-Buffering no;
    }

    # Alternative: let node serve everything, including the proxy.
    # location / { proxy_pass http://grid_app; }
}

server {
    listen 80;
    server_name llm.yourdomain.co.uk;
    return 301 https://$host$request_uri;
}
